# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app and Angular frontend - bundit-demo-robotic-forklift

on:
  push:
    branches:
      - release/2026-03-01
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci --legacy-peer-deps

      - name: Build Angular app
        working-directory: Frontend
        run: npm run build -- --configuration production

      - name: Copy Angular output into WebAPI wwwroot
        run: |
          mkdir -p Backend/Forklift.WebAPI/wwwroot
          cp -r Frontend/dist/frontend/browser/. Backend/Forklift.WebAPI/wwwroot/

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build Backend/Forklift.sln --configuration Release

      - name: dotnet publish
        run: dotnet publish Backend/Forklift.WebAPI/Forklift.WebAPI.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_05B5F47966D641C39100AF717F7382E5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6FEDD3C1476244AEBABFFB1B2394F355 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D996D423B68646E0B6E95EA9FBE585F7 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'bundit-demo-robotic-forklift'
          slot-name: 'Production'
          package: angular-dist
